# This workflow run tests, then create NuGet release package and the upload this release package to the NuGet registry and create new corresponding Github release.
name: Release

# Workflow is started manually
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Run C# tests
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
  
  # Create NuGet package and get version and release notes.
  pack:
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      release_notes: ${{ steps.get-notes.outputs.release-notes }}

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Get Version
        id: get-version
        run: |
          VERSION=$(dotnet build OpenCompote -getProperty:Version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Get latest release info
        id: get-notes
        uses: release-flow/keep-a-changelog-action@v2
        with:
          command: query
          version: latest
      - name: Pack NuGet package
        env:
          RELEASE_NOTES: ${{ steps.get-notes.outputs.release-notes }}
        run: |
          dotnet pack OpenCompote \
            -c Release
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./OpenCompote/bin/Release/*.nupkg

  # Upload package to NuGet and create Github release
  release:
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      contents: write
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenCompote_v${{ needs.pack.outputs.version }}
          name: OpenCompote v${{ needs.pack.outputs.version }}
          body: ${{ needs.pack.outputs.release_notes }}
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_OWNER_NAME }}
      - name: Push package to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json
