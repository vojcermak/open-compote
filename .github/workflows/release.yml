# Testing if this workflow runs when i trigger it manually.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: 10.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
    
  pack:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Get Version
        id: get-version
        run: |
          VERSION=$(dotnet build OpenCompote -getProperty:Version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Get latest release info
        id: get-notes
        uses: release-flow/keep-a-changelog-action@v2
        with:
          command: query
          version: latest
      - name: Pack NuGet package
        run: |
          dotnet pack OpenCompote \
            -c Release \
            -p:PackageReleaseNotes="${{ steps.get-notes.outputs.release-notes }}"
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./OpenCompote/bin/Release/*.nupkg

  release:
    runs-on: ubuntu-latest
    needs: pack
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Get Version
        id: get-version
        run: |
          VERSION=$(dotnet build OpenCompote -getProperty:Version)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest release info
        id: get-notes
        uses: release-flow/keep-a-changelog-action@v2
        with:
          command: query
          version: latest

      - name: Download NuGet package artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OpenCompote_v${{ steps.get-version.outputs.version }}
          name: OpenCompote v${{ steps.get-version.outputs.version }}
          body: ${{ steps.get-notes.outputs.release-notes }}

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: vojcermak

      - name: Push package to NuGet
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json